# Vercel auto-deploys frontend from GitHub (no action needed)
# Render auto-deploys backend from GitHub (no action needed)
# This workflow only runs lint checks on push

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node -e "require('./server')" || true
        env:
          JWT_SECRET: ci-test-secret
